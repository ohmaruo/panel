<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IRIAM向け 画像サイズ追従 パネル開けツール</title>
    <style>
        :root {
            --primary-color: #ff7ebb;
            --primary-hover: #ff52a0;
            --bg-color: #fff5f8;
            --card-bg: #ffffff;
            --text-color: #4a4a4a;
            --border-color: #ffe0eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: #fff;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .app-container {
            display: flex;
            flex: 1;
            flex-direction: column;
        }

        @media (min-width: 850px) {
            .app-container {
                flex-direction: row;
                height: calc(100vh - 50px);
                overflow: hidden;
            }
        }

        .sidebar {
            width: 100%;
            background: var(--card-bg);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        @media (min-width: 850px) {
            .sidebar {
                width: 340px;
                border-right: 1px solid var(--border-color);
                overflow-y: auto;
            }
            .sidebar.right {
                border-right: none;
                border-left: 1px solid var(--border-color);
            }
        }

        .panel-section {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .panel-title {
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #FAF8F9;
            padding: 15px;
            gap: 15px;
            overflow-y: auto;
        }

        .canvas-container {
            position: relative;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            background-color: #ffffff;
            background-image: linear-gradient(45deg, #eee 25%, transparent 25%), linear-gradient(-45deg, #eee 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #eee 75%), linear-gradient(-45deg, transparent 75%, #eee 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            border-radius: 8px;
            overflow: hidden;
            touch-action: none;
        }

        #bgCanvas, .layer-canvas, #overlayCanvas, #interactiveCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #interactiveCanvas {
            z-index: 50;
            cursor: move;
        }

        .progress-card {
            width: 100%;
            max-width: 400px;
            background: #fff;
            padding: 12px 16px;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(255, 126, 187, 0.15);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background: #ffe0eb;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--primary-color);
            transition: width 0.3s ease;
        }

        .form-group {
            margin-bottom: 8px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            margin-bottom: 4px;
            color: #666;
        }

        .form-row {
            display: flex;
            gap: 8px;
        }

        input[type="number"], input[type="color"], input[type="text"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        input[type="color"] {
            height: 38px;
            padding: 2px;
            cursor: pointer;
        }

        .btn {
            padding: 10px 12px;
            border: none;
            border-radius: 6px;
            background: var(--primary-color);
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 0.85rem;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
        }

        .btn-success {
            background: #28a745;
        }

        .btn-danger {
            background: #dc3545;
        }

        .btn-danger:hover {
            background: #bd2130;
        }

        .shape-btns {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .shape-btn {
            padding: 10px 0;
            border: 1px solid var(--border-color);
            background: #fff;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-size: 1.2rem;
            user-select: none;
        }

        .shape-btn:hover {
            background: #fff0f5;
        }

        .layer-category-title {
            font-weight: bold;
            font-size: 0.8rem;
            color: var(--primary-color);
            background: #fff0f5;
            padding: 4px 8px;
            border-radius: 4px;
            margin-top: 8px;
            margin-bottom: 6px;
        }

        .layer-list {
            list-style: none;
            max-height: 250px;
            overflow-y: auto;
        }

        .layer-item {
            display: flex;
            flex-direction: column;
            padding: 8px;
            background: #fff;
            border: 1px solid #eee;
            border-radius: 6px;
            margin-bottom: 6px;
            gap: 6px;
            font-size: 0.85rem;
        }

        .layer-item-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .layer-visibility {
            cursor: pointer;
            font-size: 1.1rem;
            user-select: none;
        }

        .layer-name {
            flex: 1;
            border: 1px solid #eee;
            background: #fafafa;
            border-radius: 4px;
            padding: 4px 6px;
            font-size: 0.85rem;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: #fafafa;
            padding: 6px;
            border-radius: 4px;
        }

        .size-control {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: #666;
        }

        .size-control input[type="range"] {
            flex: 1;
        }

        .btn-delete {
            background: #ff4d4f;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 2px 6px;
            cursor: pointer;
            font-size: 0.75rem;
        }

        input[type="file"] {
            display: none;
        }

        /* プレビューモーダル */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            max-width: 90%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .modal-content img {
            max-width: 100%;
            max-height: 60vh;
            object-fit: contain;
            border-radius: 6px;
            border: 1px solid #ddd;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">一枚絵パネル開けツール</div>
        <button class="btn btn-danger" style="width: auto; padding: 6px 12px; font-size: 0.8rem;" onclick="resetAllData()">最初からやり直す（リセット）</button>
    </header>

    <div class="app-container">
        <!-- 左側設定 -->
        <div class="sidebar">
            <div class="panel-section">
                <div class="panel-title">1. 画像アップロード (透過PNG推奨)</div>
                <label class="btn btn-outline">
                    画像を選択
                    <input type="file" accept="image/*" onchange="handleImageUpload(event)">
                </label>
            </div>

            <div class="panel-section">
                <div class="panel-title">2. 画像輪郭分割（マス設定）</div>
                <div class="form-row">
                    <div class="form-group">
                        <label>行 (縦)</label>
                        <input type="number" id="gridRows" value="3" min="1" max="20" onchange="rebuildAll()">
                    </div>
                    <div class="form-group">
                        <label>列 (横)</label>
                        <input type="number" id="gridCols" value="3" min="1" max="20" onchange="rebuildAll()">
                    </div>
                </div>
                <div class="form-group">
                    <label>パネルカラー</label>
                    <input type="color" id="panelColor" value="#ff7ebb" onchange="rebuildAll()">
                </div>
            </div>

            <div class="panel-section">
                <div class="panel-title">3. 特殊パーツ追加 (ドラッグで移動可)</div>
                <div class="shape-btns">
                    <button class="shape-btn" onclick="addShape('heart')">♥</button>
                    <button class="shape-btn" onclick="addShape('star')">★</button>
                    <button class="shape-btn" onclick="addShape('circle')">●</button>
                    <button class="shape-btn" onclick="addShape('cloud')">☁</button>
                </div>
            </div>

            <div class="panel-section">
                <div class="panel-title">4. パネル文字スタイリング設定</div>
                <div class="form-row">
                    <div class="form-group">
                        <label>文字色</label>
                        <input type="color" id="textColor" value="#ffffff" onchange="processSegmentation()">
                    </div>
                    <div class="form-group">
                        <label>文字サイズ</label>
                        <input type="number" id="textSize" value="16" min="8" max="40" onchange="processSegmentation()">
                    </div>
                </div>
            </div>

            <div class="panel-section">
                <div class="panel-title">5. 境界線設定</div>
                <div class="form-row">
                    <div class="form-group">
                        <label>色</label>
                        <input type="color" id="borderColor" value="#ffffff" onchange="drawOverlay()">
                    </div>
                    <div class="form-group">
                        <label>太さ</label>
                        <input type="number" id="borderWidth" value="3" min="1" max="10" onchange="drawOverlay()">
                    </div>
                </div>
            </div>
        </div>

        <!-- 作業キャンバス -->
        <div class="workspace">
            <div class="canvas-container" id="canvasContainer" style="width: 350px; height: 350px;">
                <canvas id="bgCanvas"></canvas>
                <div id="cutoutLayersContainer"></div>
                <canvas id="overlayCanvas"></canvas>
                <canvas id="interactiveCanvas"></canvas>
            </div>

            <!-- 進捗カード -->
            <div class="progress-card">
                <div class="progress-header">
                    <span>達成度: <span id="percentText" style="color: var(--primary-color);">0%</span></span>
                    <span>OPEN: <span id="openCount" style="color: var(--primary-color);">0</span> / <span id="totalCount">0</span> (残り<span id="remainCount">0</span>)</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressBar"></div>
                </div>
            </div>

            <div style="width: 100%; max-width: 400px;">
                <button class="btn btn-success" onclick="openPreviewModal()">
                    現在の開封状況を画像化（長押し保存）
                </button>
            </div>
        </div>

        <!-- 右側レイヤー一覧 -->
        <div class="sidebar right">
            <div class="panel-section">
                <div class="panel-title">パネル一括操作</div>
                <div style="display: flex; gap: 5px; margin-bottom: 8px;">
                    <button class="btn btn-outline" onclick="setAllVisibility(true)">全表示</button>
                    <button class="btn btn-outline" onclick="setAllVisibility(false)">全非表示</button>
                </div>
                <button class="btn" onclick="openRandomPanel()">ランダムで1枚開ける</button>
            </div>

            <div class="panel-section" style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
                <div class="panel-title">分割レイヤー一覧（名前がパネルに反映されます）</div>
                <div style="overflow-y: auto; flex: 1;">
                    <div class="layer-category-title">★ 特殊パーツ</div>
                    <ul class="layer-list" id="shapeLayerList"></ul>

                    <div class="layer-category-title">■ 通常パネル（マス目）</div>
                    <ul class="layer-list" id="gridLayerList"></ul>
                </div>
            </div>
        </div>
    </div>

    <!-- プレビューモーダル -->
    <div class="modal-overlay" id="previewModal" onclick="closePreviewModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="panel-title" style="margin-bottom: 0;">画像を長押し、または保存してください</div>
            <p style="font-size: 0.75rem; color: #666; text-align: center;">スマホでは画像を長押しして「写真に追加」や「画像を保存」が行えます。</p>
            <img id="previewImage" alt="開封状況プレビュー">
            <div class="modal-buttons">
                <button class="btn btn-outline" onclick="closePreviewModal()">閉じる</button>
                <button class="btn btn-success" onclick="downloadImage()">端末にダウンロード</button>
            </div>
        </div>
    </div>

    <script>
        let baseImage = null;
        let canvasWidth = 350;
        let canvasHeight = 350;

        let gridRows = 3;
        let gridCols = 3;
        let shapes = [];
        let layerRegions = [];
        let customNames = {};

        let isDragging = false;
        let draggedShape = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d', { willReadFrequently: true });
        const overlayCanvas = document.getElementById('overlayCanvas');
        const overlayCtx = overlayCanvas.getContext('2d');
        const interactiveCanvas = document.getElementById('interactiveCanvas');
        const cutoutContainer = document.getElementById('cutoutLayersContainer');

        window.onload = () => {
            loadSavedState();
            adjustCanvasScale();
            if (!baseImage) {
                drawPlaceholder();
            }
            rebuildAll();
            setupShapeDragEvents();
            window.addEventListener('resize', adjustCanvasScale);
        };

        function resetAllData() {
            if (confirm("全てのパーツや変更設定を初期化して、最初からやり直しますか？")) {
                localStorage.removeItem('panel_tool_state');
                shapes = [];
                customNames = {};
                baseImage = null;
                document.getElementById('gridRows').value = 3;
                document.getElementById('gridCols').value = 3;
                document.getElementById('panelColor').value = "#ff7ebb";
                document.getElementById('textColor').value = "#ffffff";
                document.getElementById('textSize').value = 16;
                document.getElementById('borderColor').value = "#ffffff";
                document.getElementById('borderWidth').value = 3;
                adjustCanvasScale();
                drawPlaceholder();
                rebuildAll();
            }
        }

        function adjustCanvasScale() {
            const screenWidth = window.innerWidth;
            let maxWidth = screenWidth < 480 ? Math.min(screenWidth - 40, 350) : 400;

            if (baseImage) {
                const aspect = baseImage.height / baseImage.width;
                canvasWidth = maxWidth;
                canvasHeight = maxWidth * aspect;
            } else {
                canvasWidth = maxWidth;
                canvasHeight = maxWidth;
            }

            const container = document.getElementById('canvasContainer');
            container.style.width = canvasWidth + 'px';
            container.style.height = canvasHeight + 'px';

            [bgCanvas, overlayCanvas, interactiveCanvas].forEach(c => {
                c.width = canvasWidth;
                c.height = canvasHeight;
            });

            if (baseImage) {
                drawBaseImage();
            }
        }

        function drawPlaceholder() {
            bgCtx.clearRect(0, 0, canvasWidth, canvasHeight);
            bgCtx.fillStyle = '#888888';
            bgCtx.font = '14px sans-serif';
            bgCtx.textAlign = 'center';
            bgCtx.fillText('画像をアップロードしてください', canvasWidth / 2, canvasHeight / 2);
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const maxUploadWidth = 1200;
                    let w = img.width;
                    let h = img.height;

                    if (w > maxUploadWidth) {
                        h = Math.round((h * maxUploadWidth) / w);
                        w = maxUploadWidth;
                    }

                    const tempCnv = document.createElement('canvas');
                    tempCnv.width = w;
                    tempCnv.height = h;
                    const tCtx = tempCnv.getContext('2d');
                    tCtx.drawImage(img, 0, 0, w, h);

                    const compressedDataUrl = tempCnv.toDataURL('image/png');
                    const compressedImg = new Image();
                    compressedImg.onload = () => {
                        baseImage = compressedImg;
                        adjustCanvasScale();
                        rebuildAll();
                    };
                    compressedImg.src = compressedDataUrl;
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function drawBaseImage() {
            bgCtx.clearRect(0, 0, canvasWidth, canvasHeight);
            bgCtx.drawImage(baseImage, 0, 0, canvasWidth, canvasHeight);
        }

        function addShape(type) {
            const newShapeId = 'shape_' + Date.now();
            shapes.push({
                id: newShapeId,
                type: type,
                x: canvasWidth / 2,
                y: canvasHeight / 2,
                size: Math.min(canvasWidth, canvasHeight) * 0.25,
                rotation: 0
            });
            rebuildAll();
        }

        function removeShape(id) {
            shapes = shapes.filter(s => s.id !== id);
            delete customNames[id];
            rebuildAll();
        }

        function updateShapeSize(id, newSize) {
            const shape = shapes.find(s => s.id === id);
            if (shape) {
                shape.size = parseFloat(newSize);
                processSegmentation();
            }
        }

        function updateShapeRotation(id, newAngle) {
            const shape = shapes.find(s => s.id === id);
            if (shape) {
                shape.rotation = parseFloat(newAngle);
                processSegmentation();
            }
        }

        function getShapePath2D(s) {
            const path = new Path2D();
            const { x, y, size, type, rotation = 0 } = s;
            const rad = (rotation * Math.PI) / 180;
            const cos = Math.cos(rad);
            const sin = Math.sin(rad);

            const transformPoint = (px, py) => {
                const dx = px - x;
                const dy = py - y;
                return {
                    x: x + (dx * cos - dy * sin),
                    y: y + (dx * sin + dy * cos)
                };
            };

            if (type === 'heart') {
                const w = size / 2;
                const h = size / 2;

                let pBottom = transformPoint(x, y + h * 0.95);
                let cp1_l   = transformPoint(x - w * 1.2, y + h * 0.3);
                let cp2_l   = transformPoint(x - w * 1.1, y - h * 0.9);
                let pTopL   = transformPoint(x, y - h * 0.25);

                let cp2_r   = transformPoint(x + w * 1.1, y - h * 0.9);
                let cp1_r   = transformPoint(x + w * 1.2, y + h * 0.3);

                path.moveTo(pBottom.x, pBottom.y);
                path.bezierCurveTo(cp1_l.x, cp1_l.y, cp2_l.x, cp2_l.y, pTopL.x, pTopL.y);
                path.bezierCurveTo(cp2_r.x, cp2_r.y, cp1_r.x, cp1_r.y, pBottom.x, pBottom.y);
                path.closePath();

            } else if (type === 'star') {
                let pts = 5, outer = size / 2, inner = outer / 2.5;
                for (let i = 0; i < pts * 2; i++) {
                    let r = (i % 2 === 0) ? outer : inner;
                    let a = (i * Math.PI) / pts - Math.PI / 2;
                    let pt = transformPoint(x + r * Math.cos(a), y + r * Math.sin(a));
                    if (i === 0) path.moveTo(pt.x, pt.y);
                    else path.lineTo(pt.x, pt.y);
                }
                path.closePath();
            } else if (type === 'circle') {
                path.arc(x, y, size / 2, 0, Math.PI * 2);
            } else if (type === 'cloud') {
                let r = size / 3;
                let c1 = transformPoint(x - r, y);
                let c2 = transformPoint(x, y - r * 0.7);
                let c3 = transformPoint(x + r, y);

                path.arc(c1.x, c1.y, r * 0.8, Math.PI * 0.5 + rad, Math.PI * 1.5 + rad);
                path.arc(c2.x, c2.y, r * 0.9, Math.PI * 1.0 + rad, Math.PI * 2.0 + rad);
                path.arc(c3.x, c3.y, r * 0.8, Math.PI * 1.5 + rad, Math.PI * 0.5 + rad);
                path.closePath();
            }

            return path;
        }

        function drawTextOnContext(ctx, text, x, y) {
            if (!text) return;

            const textColor = document.getElementById('textColor').value;
            const textSize = document.getElementById('textSize').value;

            ctx.save();
            ctx.font = `bold ${textSize}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            ctx.strokeStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.lineWidth = Math.max(2, textSize / 6);
            ctx.lineJoin = 'round';
            ctx.strokeText(text, x, y);

            ctx.fillStyle = textColor;
            ctx.fillText(text, x, y);
            ctx.restore();
        }

        function rebuildAll() {
            processSegmentation();
            updateLayerUI();
            updateCounters();
        }

        function processSegmentation() {
            cutoutContainer.innerHTML = '';
            layerRegions = [];

            gridRows = parseInt(document.getElementById('gridRows').value, 10);
            gridCols = parseInt(document.getElementById('gridCols').value, 10);
            const panelColor = document.getElementById('panelColor').value;

            const cellW = canvasWidth / gridCols;
            const cellH = canvasHeight / gridRows;

            let idx = 1;

            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) {
                    const rx = c * cellW, ry = r * cellH;
                    const regionId = `grid_${r}_${c}`;

                    let hasImagePixel = false;
                    if (baseImage) {
                        const imgData = bgCtx.getImageData(rx, ry, cellW, cellH).data;
                        for (let i = 3; i < imgData.length; i += 16) {
                            if (imgData[i] > 20) {
                                hasImagePixel = true;
                                break;
                            }
                        }
                    } else {
                        hasImagePixel = true;
                    }

                    if (!hasImagePixel) continue;

                    const rectPath = new Path2D();
                    rectPath.rect(rx, ry, cellW, cellH);

                    const layerCanvas = document.createElement('canvas');
                    layerCanvas.width = canvasWidth;
                    layerCanvas.height = canvasHeight;
                    layerCanvas.className = 'layer-canvas';

                    const lCtx = layerCanvas.getContext('2d');
                    
                    lCtx.fillStyle = panelColor;
                    lCtx.fillRect(rx, ry, cellW, cellH);

                    if (baseImage) {
                        lCtx.globalCompositeOperation = 'destination-in';
                        lCtx.drawImage(bgCanvas, 0, 0);
                        lCtx.globalCompositeOperation = 'source-over';
                    }

                    shapes.forEach(s => {
                        lCtx.globalCompositeOperation = 'destination-out';
                        lCtx.fill(getShapePath2D(s));
                        lCtx.globalCompositeOperation = 'source-over';
                    });

                    const defaultName = `パネル ${String(idx).padStart(2, '0')}`;
                    const displayName = customNames[regionId] !== undefined ? customNames[regionId] : defaultName;

                    drawTextOnContext(lCtx, displayName, rx + cellW / 2, ry + cellH / 2);

                    cutoutContainer.appendChild(layerCanvas);

                    layerRegions.push({
                        id: regionId,
                        name: displayName,
                        path: rectPath,
                        isVisible: true,
                        canvas: layerCanvas,
                        type: 'grid'
                    });
                    idx++;
                }
            }

            shapes.forEach((s, sIdx) => {
                const shapePath = getShapePath2D(s);
                const regionId = s.id;
                const names = { heart: 'ハート', star: '星', circle: '丸', cloud: '雲' };

                const layerCanvas = document.createElement('canvas');
                layerCanvas.width = canvasWidth;
                layerCanvas.height = canvasHeight;
                layerCanvas.className = 'layer-canvas';

                const lCtx = layerCanvas.getContext('2d');
                lCtx.save();
                lCtx.clip(shapePath);
                lCtx.fillStyle = panelColor;
                lCtx.fillRect(0, 0, canvasWidth, canvasHeight);

                if (baseImage) {
                    lCtx.globalCompositeOperation = 'destination-in';
                    lCtx.drawImage(bgCanvas, 0, 0);
                }
                lCtx.restore();

                const defaultName = `${names[s.type] || 'パーツ'} ${sIdx + 1}`;
                const displayName = customNames[regionId] !== undefined ? customNames[regionId] : defaultName;

                drawTextOnContext(lCtx, displayName, s.x, s.y);

                cutoutContainer.appendChild(layerCanvas);

                layerRegions.push({
                    id: regionId,
                    name: displayName,
                    path: shapePath,
                    isVisible: true,
                    canvas: layerCanvas,
                    type: 'shape',
                    shapeObj: s
                });
            });

            applySavedVisibility();
            drawOverlay();
            saveState();
        }

        function drawOverlay() {
            overlayCtx.clearRect(0, 0, canvasWidth, canvasHeight);

            const borderColor = document.getElementById('borderColor').value;
            const borderWidth = parseInt(document.getElementById('borderWidth').value, 10);

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvasWidth;
            tempCanvas.height = canvasHeight;
            const tCtx = tempCanvas.getContext('2d');

            tCtx.strokeStyle = borderColor;
            tCtx.lineWidth = borderWidth;

            const cellW = canvasWidth / gridCols;
            const cellH = canvasHeight / gridRows;

            for (let r = 0; r <= gridRows; r++) {
                tCtx.beginPath();
                tCtx.moveTo(0, r * cellH);
                tCtx.lineTo(canvasWidth, r * cellH);
                tCtx.stroke();
            }
            for (let c = 0; c <= gridCols; c++) {
                tCtx.beginPath();
                tCtx.moveTo(c * cellW, 0);
                tCtx.lineTo(c * cellW, canvasHeight);
                tCtx.stroke();
            }

            shapes.forEach(s => {
                const path = getShapePath2D(s);
                tCtx.globalCompositeOperation = 'destination-out';
                tCtx.fill(path);
                tCtx.globalCompositeOperation = 'source-over';
            });

            overlayCtx.drawImage(tempCanvas, 0, 0);

            shapes.forEach(s => {
                const path = getShapePath2D(s);
                overlayCtx.strokeStyle = borderColor;
                overlayCtx.lineWidth = borderWidth;
                overlayCtx.stroke(path);

                overlayCtx.save();
                overlayCtx.strokeStyle = '#28a745';
                overlayCtx.lineWidth = 1.5;
                overlayCtx.setLineDash([3, 3]);
                overlayCtx.stroke(path);
                overlayCtx.restore();
            });
        }

        // 特殊パーツをキャンバス上で動かすためのドラッグ専用イベント
        function setupShapeDragEvents() {
            const getPos = (e) => {
                const rect = interactiveCanvas.getBoundingClientRect();
                const scaleX = canvasWidth / rect.width;
                const scaleY = canvasHeight / rect.height;

                let clientX = e.clientX;
                let clientY = e.clientY;

                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                }

                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const handleStart = (e) => {
                const pos = getPos(e);

                for (let i = shapes.length - 1; i >= 0; i--) {
                    const s = shapes[i];
                    const path = getShapePath2D(s);
                    if (overlayCtx.isPointInPath(path, pos.x, pos.y)) {
                        isDragging = true;
                        draggedShape = s;
                        dragOffsetX = pos.x - s.x;
                        dragOffsetY = pos.y - s.y;
                        e.preventDefault();
                        break;
                    }
                }
            };

            const handleMove = (e) => {
                if (isDragging && draggedShape) {
                    const pos = getPos(e);
                    draggedShape.x = pos.x - dragOffsetX;
                    draggedShape.y = pos.y - dragOffsetY;
                    processSegmentation();
                    e.preventDefault();
                }
            };

            const handleEnd = () => {
                isDragging = false;
                draggedShape = null;
            };

            interactiveCanvas.addEventListener('mousedown', handleStart);
            interactiveCanvas.addEventListener('mousemove', handleMove);
            window.addEventListener('mouseup', handleEnd);

            interactiveCanvas.addEventListener('touchstart', handleStart, { passive: false });
            interactiveCanvas.addEventListener('touchmove', handleMove, { passive: false });
            window.addEventListener('touchend', handleEnd);
        }

        function toggleLayerVisibility(id) {
            const layer = layerRegions.find(l => l.id === id);
            if (layer) {
                layer.isVisible = !layer.isVisible;
                layer.canvas.style.display = layer.isVisible ? 'block' : 'none';
                
                const icon = document.getElementById(`vis_icon_${id}`);
                if (icon) icon.textContent = layer.isVisible ? '👁️' : '🙈';

                updateCounters();
                saveState();
            }
        }

        function updateLayerUI() {
            const shapeList = document.getElementById('shapeLayerList');
            const gridList = document.getElementById('gridLayerList');
            
            shapeList.innerHTML = '';
            gridList.innerHTML = '';

            const maxAllowedSize = Math.min(canvasWidth, canvasHeight) * 0.6;
            const minAllowedSize = Math.min(canvasWidth, canvasHeight) * 0.1;

            layerRegions.forEach(layer => {
                const li = document.createElement('li');
                li.className = 'layer-item';

                const row = document.createElement('div');
                row.className = 'layer-item-row';

                const visIcon = document.createElement('span');
                visIcon.className = 'layer-visibility';
                visIcon.id = `vis_icon_${layer.id}`;
                visIcon.textContent = layer.isVisible ? '👁️' : '🙈';
                visIcon.onclick = () => toggleLayerVisibility(layer.id);

                const nameInput = document.createElement('input');
                nameInput.type = 'text';
                nameInput.className = 'layer-name';
                nameInput.value = layer.name;
                
                nameInput.addEventListener('change', (e) => updateName(layer.id, e.target.value));

                row.appendChild(visIcon);
                row.appendChild(nameInput);

                if (layer.type === 'shape') {
                    const delBtn = document.createElement('button');
                    delBtn.className = 'btn-delete';
                    delBtn.textContent = '削除';
                    delBtn.onclick = () => removeShape(layer.id);
                    row.appendChild(delBtn);

                    li.appendChild(row);

                    const controls = document.createElement('div');
                    controls.className = 'control-group';

                    const sizeCtrl = document.createElement('div');
                    sizeCtrl.className = 'size-control';
                    
                    const sizeSpan = document.createElement('span');
                    sizeSpan.textContent = 'サイズ';
                    const sizeInput = document.createElement('input');
                    sizeInput.type = 'range';
                    sizeInput.min = minAllowedSize;
                    sizeInput.max = maxAllowedSize;
                    sizeInput.value = layer.shapeObj.size;
                    sizeInput.oninput = (e) => updateShapeSize(layer.id, e.target.value);
                    
                    sizeCtrl.appendChild(sizeSpan);
                    sizeCtrl.appendChild(sizeInput);

                    const rotCtrl = document.createElement('div');
                    rotCtrl.className = 'size-control';

                    const rotSpan = document.createElement('span');
                    rotSpan.textContent = '回転';
                    const rotInput = document.createElement('input');
                    rotInput.type = 'range';
                    rotInput.min = 0;
                    rotInput.max = 360;
                    rotInput.value = layer.shapeObj.rotation || 0;
                    rotInput.oninput = (e) => updateShapeRotation(layer.id, e.target.value);

                    rotCtrl.appendChild(rotSpan);
                    rotCtrl.appendChild(rotInput);

                    controls.appendChild(sizeCtrl);
                    controls.appendChild(rotCtrl);
                    li.appendChild(controls);

                    shapeList.appendChild(li);
                } else {
                    li.appendChild(row);
                    gridList.appendChild(li);
                }
            });
        }

        function updateName(id, newName) {
            customNames[id] = newName;
            processSegmentation();
        }

        function setAllVisibility(visible) {
            layerRegions.forEach(l => {
                l.isVisible = visible;
                l.canvas.style.display = visible ? 'block' : 'none';
                const icon = document.getElementById(`vis_icon_${l.id}`);
                if (icon) icon.textContent = visible ? '👁️' : '🙈';
            });
            updateCounters();
            saveState();
        }

        function openRandomPanel() {
            const visibleLayers = layerRegions.filter(l => l.isVisible);
            if (visibleLayers.length > 0) {
                const randomIndex = Math.floor(Math.random() * visibleLayers.length);
                toggleLayerVisibility(visibleLayers[randomIndex].id);
            }
        }

        function updateCounters() {
            const total = layerRegions.length;
            const open = layerRegions.filter(l => !l.isVisible).length;
            const remain = total - open;
            const percent = total > 0 ? Math.round((open / total) * 100) : 0;

            document.getElementById('totalCount').textContent = total;
            document.getElementById('openCount').textContent = open;
            document.getElementById('remainCount').textContent = remain;
            document.getElementById('percentText').textContent = `${percent}%`;
            document.getElementById('progressBar').style.width = `${percent}%`;
        }

        let currentExportDataUrl = '';

        function openPreviewModal() {
            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = canvasWidth;
            exportCanvas.height = canvasHeight;
            const eCtx = exportCanvas.getContext('2d');

            if (baseImage) {
                eCtx.drawImage(bgCanvas, 0, 0);
            }

            layerRegions.forEach(l => {
                if (l.isVisible) {
                    eCtx.drawImage(l.canvas, 0, 0);
                }
            });

            eCtx.drawImage(overlayCanvas, 0, 0);

            currentExportDataUrl = exportCanvas.toDataURL('image/png');
            document.getElementById('previewImage').src = currentExportDataUrl;
            document.getElementById('previewModal').style.display = 'flex';
        }

        function closePreviewModal() {
            document.getElementById('previewModal').style.display = 'none';
        }

        function downloadImage() {
            if (!currentExportDataUrl) return;
            const link = document.createElement('a');
            link.download = `panel_open_${Date.now()}.png`;
            link.href = currentExportDataUrl;
            link.click();
        }

        function saveState() {
            const state = {
                gridRows: document.getElementById('gridRows').value,
                gridCols: document.getElementById('gridCols').value,
                panelColor: document.getElementById('panelColor').value,
                textColor: document.getElementById('textColor').value,
                textSize: document.getElementById('textSize').value,
                borderColor: document.getElementById('borderColor').value,
                borderWidth: document.getElementById('borderWidth').value,
                shapes: shapes,
                customNames: customNames,
                visibility: layerRegions.reduce((acc, layer) => {
                    acc[layer.id] = layer.isVisible;
                    return acc;
                }, {})
            };
            try {
                localStorage.setItem('panel_tool_state', JSON.stringify(state));
            } catch (e) {
                console.warn('自動保存に失敗しました:', e);
            }
        }

        let pendingVisibility = null;

        function loadSavedState() {
            const saved = localStorage.getItem('panel_tool_state');
            if (!saved) return;

            try {
                const state = JSON.parse(saved);
                if (state.gridRows) document.getElementById('gridRows').value = state.gridRows;
                if (state.gridCols) document.getElementById('gridCols').value = state.gridCols;
                if (state.panelColor) document.getElementById('panelColor').value = state.panelColor;
                if (state.textColor) document.getElementById('textColor').value = state.textColor;
                if (state.textSize) document.getElementById('textSize').value = state.textSize;
                if (state.borderColor) document.getElementById('borderColor').value = state.borderColor;
                if (state.borderWidth) document.getElementById('borderWidth').value = state.borderWidth;
                
                if (state.shapes) shapes = state.shapes;
                if (state.customNames) customNames = state.customNames;
                if (state.visibility) pendingVisibility = state.visibility;
            } catch (e) {
                console.warn('保存データの読み込みに失敗しました:', e);
            }
        }

        function applySavedVisibility() {
            if (!pendingVisibility) return;
            layerRegions.forEach(l => {
                if (pendingVisibility[l.id] !== undefined) {
                    l.isVisible = pendingVisibility[l.id];
                    l.canvas.style.display = l.isVisible ? 'block' : 'none';
                    const icon = document.getElementById(`vis_icon_${l.id}`);
                    if (icon) icon.textContent = l.isVisible ? '👁️' : '🙈';
                }
            });
            pendingVisibility = null;
            updateCounters();
        }
    </script>
</body>
